<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conferencias Internacionales del C.E.M.I.</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Conferencias Internacionales del C.E.M.I.">
<meta property="og:description" content="Una colección de Conferencias Internacionales del C.E.M.I.">
<meta property="og:image" content="https://lucksys.github.io/videos/conferencias-cemi/portada.jpg">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Conferencias Internacionales del C.E.M.I.">
<meta name="twitter:image" content="https://lucksys.github.io/videos/conferencias-cemi/portada.jpg">

<style>
:root{
--gold:#d4af37;
--bg:rgba(0,0,0,.92);
--panel:rgba(10,10,10,.78);
--card:#111;
--text:#f3e7b3;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Georgia,serif;
background:url("portada.jpg") no-repeat center fixed;
background-size:cover;
color:var(--gold)
}

.overlay{
background:var(--bg);
min-height:100vh;
padding:20px
}

h1{
text-align:center;
text-shadow:0 0 15px var(--gold)
}

.container{
display:flex;
gap:20px;
flex-wrap:wrap
}

.column{
flex:1;
min-width:320px;
border:1px solid var(--gold);
padding:15px;
border-radius:12px;
background:var(--panel)
}

.grid{
display:grid;
gap:25px
}

.card{
position:relative;
background:var(--card);
border:1px solid var(--gold);
border-radius:12px;
overflow:hidden;
display:flex;
flex-direction:column
}

.card:hover{
box-shadow:0 0 20px var(--gold)
}

.card-title{
padding:10px 12px;
text-align:left;
color:var(--text);
line-height:1.2;
word-break:break-word
}

/* Línea de botones */
.button-row-top{
display:grid;
grid-template-columns:1.25fr .6fr;
gap:6px;
padding:0 12px 8px;
width:100%
}

.copy-btn,
.info-btn{
height:32px;
background:#000;
color:#fff;
border:1px solid var(--gold);
border-radius:8px;
font-size:12px;
font-weight:normal;
cursor:pointer;
white-space:nowrap;
width:100%;
min-width:0;
padding:0 4px
}

.card img{
width:100%;
display:block;
background:#000;
cursor:pointer
}

/* Aviso de copia */
.copy-notification{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,.96);
color:var(--text);
border:2px solid var(--gold);
border-radius:12px;
padding:22px 35px;
min-width:360px;
max-width:80vw;
text-align:center;
font-family:Georgia,serif;
font-size:20px;
font-weight:bold;
line-height:1.4;
white-space:pre-line;
box-shadow:0 0 25px rgba(212,175,55,.55);
z-index:9999;
display:none;
pointer-events:none
}

.copy-notification.active{
display:block
}

.info-overlay{
position:fixed;
inset:0;
background:#000a;
display:none;
align-items:center;
justify-content:center;
z-index:9998
}

.info-overlay.active{
display:flex
}

.info-popup{
position:relative;
background:#111;
padding:20px;
border:1px solid var(--gold);
max-width:500px;
width:90%;
color:var(--text)
}

.info-close{
position:absolute;
top:10px;
right:10px;
background:#000;
color:#fff;
border:1px solid var(--gold);
border-radius:8px;
font-weight:bold;
cursor:pointer
}
</style>

</head>

<body>

<div class="overlay">

<h1>Conferencias Internacionales del C.E.M.I.</h1>

<div class="container">

<div class="column">

<h2>Videos</h2>

<div id="videos" class="grid">
<div class="loading">Cargando...</div>
</div>

</div>

<div class="column"></div>

</div>

<div id="copyNotification" class="copy-notification"></div>

<div id="infoOverlay" class="info-overlay">

<div class="info-popup">

<button id="infoClose" class="info-close">X</button>

<h3 id="infoTitulo"></h3>

<p id="infoTexto"></p>

</div>

</div>

<script>
(function(){

const contenedor=document.getElementById("videos");
const infoOverlay=document.getElementById("infoOverlay");
const infoTitulo=document.getElementById("infoTitulo");
const infoTexto=document.getElementById("infoTexto");
const copyNotification=document.getElementById("copyNotification");

document.getElementById("infoClose").onclick=()=>{
infoOverlay.classList.remove("active");
};

/* =========================================
   AVISO
   Funciona en PC, Android e iPhone
   ========================================= */

let notificationTimer;

function mostrarAviso(mensaje,tiempo=2500){

copyNotification.textContent="✓ "+mensaje;
copyNotification.classList.add("active");

clearTimeout(notificationTimer);

notificationTimer=setTimeout(()=>{
copyNotification.classList.remove("active");
},tiempo);

}

/* =========================================
   COPIAR URL
   Compatible con:
   - Chrome / Edge / Firefox / Safari
   - Android
   - iPhone / iPad
   ========================================= */

async function copiarURL(url){

if(!url || !url.trim()){
return false;
}

url=url.trim();

/* Método moderno */
try{

if(navigator.clipboard &&
navigator.clipboard.writeText){

await navigator.clipboard.writeText(url);
return true;

}

}catch(e){

console.warn(
"Clipboard API no disponible:",
e
);

}

/* Método alternativo */
try{

const textarea=document.createElement("textarea");

textarea.value=url;

textarea.setAttribute("readonly","");
textarea.style.position="fixed";
textarea.style.left="-9999px";
textarea.style.top="0";
textarea.style.opacity="0";

document.body.appendChild(textarea);

textarea.focus();
textarea.select();
textarea.setSelectionRange(
0,
textarea.value.length
);

const resultado=document.execCommand("copy");

document.body.removeChild(textarea);

if(resultado){
return true;
}

}catch(e){

console.error(
"Error copiando URL:",
e
);

}

return false;
}

/* =========================================
   OBTENER VALOR DE UNA CLAVE
   ========================================= */

function getValue(line){

const m=line.match(/:\s*"?([^"]*)"?\s*$/);

return m ? m[1].trim() : "";

}

/* =========================================
   ANALIZAR BLOQUE
   ========================================= */

function parseBloque(lineas){

let indice=null;
let titulo="";
let imagen="";
let video="";
let webVideo="";
let info=[];

for(let i=0;i<lineas.length;i++){

const l=lineas[i];

/* Número y título */
if(i===0){

const m=l.match(
/^\s*(\d+)\s*-\s*(.+?)\s*$/
);

if(m){

indice=parseInt(m[1],10);

titulo=m[2]
.replaceAll("_"," ")
.trim();

}

}

/* Claves */
if(/^url-imagen\s*:/i.test(l)){
imagen=getValue(l);
}

if(/^url-video\s*:/i.test(l)){
video=getValue(l);
}

if(/^web-video\s*:/i.test(l)){
webVideo=getValue(l);
}

/* Información */
if(/^info\s*:/i.test(l)){

info.push(
l.replace(/^info\s*:/i,"")
.replace(/^\s*"+/,"")
.replace(/"+\s*$/,"")
.trim()
);

for(let j=i+1;j<lineas.length;j++){

const texto=lineas[j]
.replace(/^"+/,"")
.replace(/"+$/,"")
.trim();

/* No agregar separadores */
if(!/^-{3,}$/.test(texto)){
info.push(texto);
}

}

break;

}

}

/*
   IMAGEN Y VIDEO SON LOS ÚNICOS
   DATOS OBLIGATORIOS.

   web-video puede estar vacío.
*/
if(!imagen || !video){

return null;

}

return{

indice:indice,
titulo:titulo,
imagen:imagen,
video:video,
webVideo:webVideo,
info:info.join("\n")
.replace(/-{3,}/g,"")
.trim()

};

}

/* =========================================
   ABRIR INFORMACIÓN
   ========================================= */

function abrirInfo(titulo,texto){

infoTitulo.textContent=titulo;

infoTexto.textContent=
texto || "Sin información disponible.";

infoOverlay.classList.add("active");

}

/* Cerrar información haciendo clic fuera */
infoOverlay.onclick=(e)=>{

if(e.target===infoOverlay){
infoOverlay.classList.remove("active");
}

};

/* =========================================
   CARGAR TXT
   ========================================= */

async function cargar(){

try{

const res=await fetch(
"./Lista_de_Enlaces_de_Videos.txt",
{
cache:"no-store"
}
);

if(!res.ok){

throw new Error(
"TXT no encontrado. HTTP "+res.status
);

}

const txt=await res.text();

/*
   Los bloques comienzan con:
   número - título
*/
const bloques=txt.split(
/(?=\s*\d+\s*-\s*.+)/
);

contenedor.innerHTML="";

let total=0;

for(const b of bloques){

const lineas=b
.split(/\r?\n/)
.map(l=>l.trim())
.filter(Boolean);

if(!lineas.length){
continue;
}

const d=parseBloque(lineas);

/* Ignorar bloques inválidos */
if(!d){
continue;
}

/* No mostrar registro 0 */
if(d.indice===null || d.indice===0){
continue;
}

/* =========================================
   TARJETA
   ========================================= */

const card=document.createElement("div");

card.className="card";

/* Título */
const titulo=document.createElement("div");

titulo.className="card-title";

titulo.textContent=
d.indice+" - "+d.titulo;

/* Línea de botones */
const buttonRowTop=
document.createElement("div");

buttonRowTop.className=
"button-row-top";

/* =========================================
   COMPARTIR VIDEO
   ========================================= */

const copyVideoBtn=
document.createElement("button");

copyVideoBtn.className="copy-btn";

copyVideoBtn.textContent=
"Compartir-Video";

copyVideoBtn.onclick=async(e)=>{

e.preventDefault();
e.stopPropagation();

/*
   web-video es la URL que se comparte.
*/
if(!d.webVideo){

mostrarAviso(
"⛔️ !!! No tiene Enlace Web de Video Asociado !!!",
1800
);

return;

}

const ok=await copiarURL(d.webVideo);

if(ok){

mostrarAviso(
"URL-Video : \""+
d.titulo+
"\".\n"+
"Copiado al Portapapeles",
2500
);

}else{

mostrarAviso(
"⚠️ No se pudo copiar la URL.\n"+
"Puedes mantener pulsado y copiar manualmente.",
3000
);

}

};

/* =========================================
   INFO
   ========================================= */

const infoBtn=
document.createElement("button");

infoBtn.className="info-btn";

infoBtn.textContent="info";

infoBtn.onclick=(e)=>{

e.preventDefault();
e.stopPropagation();

abrirInfo(
d.titulo,
d.info
);

};

/* Botones */
buttonRowTop.appendChild(copyVideoBtn);
buttonRowTop.appendChild(infoBtn);

/* =========================================
   IMAGEN
   ========================================= */

const img=document.createElement("img");

img.src=d.imagen;

img.alt=d.titulo;

img.loading="lazy";

img.onerror=function(){

this.onerror=null;
this.src="portada.jpg";

};

/*
   La imagen abre url-video.
*/
img.onclick=()=>{

if(d.video){

window.open(
d.video,
"_blank",
"noopener,noreferrer"
);

}

};

/* =========================================
   TARJETA
   ========================================= */

card.appendChild(titulo);

card.appendChild(buttonRowTop);

card.appendChild(img);

contenedor.appendChild(card);

total++;

}

/* Ninguna entrada */
if(total===0){

contenedor.innerHTML=
"No se encontraron conferencias.";

}

}catch(e){

contenedor.innerHTML=
"Error cargando la lista.";

console.error(
"Error:",
e
);

}

}

cargar();

})();
</script>

</body>
</html>
